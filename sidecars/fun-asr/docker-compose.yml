# Standalone compose for the fun-asr ASR sidecar — runs on the SIDECAR server
# (its own box, NOT with bob). From this directory:
#
#   docker compose up -d --build
#
# The build downloads Fun-ASR-Nano-2512 (~a couple GB, needs network) and bakes
# it into the image. bob then reaches this over the LAN at
# http://<this-host>:11502 — set that as the base_url of a `kind: asr` provider
# in bob's models.yaml. Full steps + verify checklist: README.md.
services:
  fun-asr:
    build:
      context: .
    image: fun-asr
    container_name: fun-asr
    restart: unless-stopped
    ports:
      - "11502:11502"        # LAN-published; bob uses http://<this-host>:11502
    networks:
      - default
      - sidecar-net          # how nginx-lb actually reaches us — see below
    # Headroom, not a measurement. The old 4g was a guess that had never actually
    # been exercised — until the model failed to load long before it
    # could allocate anything, so nothing ever tested the ceiling. Loading pulls
    # the whole 2.1GB model.pt in and then materialises the LLM + encoder on top;
    # a partial load on a 3GB box was already past 2.5GB RSS and still climbing.
    # Being wrong here fails as a container OOM-kill (exit 137) under
    # restart: unless-stopped, i.e. a silent restart loop rather than an ASR
    # error — so leave slack. Trim once real RSS is known (`docker stats fun-asr`
    # with the model resident).
    mem_limit: 8g
    environment:
      # Fun-ASR-Nano language: 中文 / 英文 / 日文 (no auto-detect). Override per
      # deploy; a request may also override with a top-level "language" field.
      ASR_LANGUAGE: "中文"
      ASR_ITN: "true"

# The sidecar box fronts every sidecar with an nginx-lb container that proxies
# `/asr/ -> http://fun-asr:11502` by CONTAINER NAME. That name only resolves on
# the network nginx-lb shares with us — `sidecar-net`, which lives outside this
# compose project. Declaring it here (rather than attaching by hand after the
# fact) is what makes the wiring survive a rebuild.
#
# It did not, on: a `docker compose up -d --build` brought fun-asr
# back on fun-asr_default only, nginx-lb could no longer resolve the name, and
# every /asr/* request 502'd — while the service itself answered fine on the
# host's published port, so a direct-to-host probe still looked green.
networks:
  sidecar-net:
    external: true           # pre-existing + shared; this project attaches, never owns
