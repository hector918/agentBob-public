# Standalone compose for the pp-ocrv6 OCR sidecar — runs on the SIDECAR server
# (its own box, NOT with bob). From this directory:
#
#   docker compose up -d --build
#
# The build downloads the PP-OCRv6 medium models (~140MB, needs network). bob then
# reaches this over the LAN at http://<this-host>:11500 — set that as the base_url
# of an OCR provider in bob's models.yaml, priority above the VLM. Full steps +
# verify checklist: DEPLOY.md.
services:
  pp-ocrv6:
    build:
      context: .
    image: pp-ocrv6
    container_name: pp-ocrv6
    restart: unless-stopped
    ports:
      - "11500:11500"        # LAN-published; bob uses http://<this-host>:11500
    networks:
      - default
      - sidecar-net          # how nginx-lb actually reaches us — see below
    mem_limit: 2g            # ~300MB per engine instance (OCR_ENGINE_POOL below)
                             # + headroom for a big screenshot's decode/crop/
                             # enhance copies. Was 1g until: an
                             # OOM-kill under dense large images restarts the
                             # container, and every request landing in that
                             # window gets a 502 from nginx-lb.
    environment:
      # Concurrent OCR calls = engine instances. 2: a second
      # worker barely raises throughput — ORT already spreads one request over
      # the cores — but it stops a second caller from waiting out the first
      # ~8s in full, which is what "OCR 卡住 / 抖动" actually was. bob's
      # models.yaml entry should carry the matching `concurrency: 2`.
      OCR_ENGINE_POOL: "2"
      # Engine stays RESIDENT (hector). The idle self-exit traded
      # ~400MB of RSS for a restart window every 5 idle minutes, and nginx-lb
      # answers 502 for the seconds the container is down — a self-inflicted
      # outage on a box with memory to spare. bob now queues + retries a busy
      # backend (leaf/model/40-chat.go::withBusyRetry), but that net is for real
      # faults, not for a gap we chose to create.
      OCR_IDLE_EXIT_SECONDS: "0"

# The sidecar box fronts every sidecar with an nginx-lb container that proxies
# `/ocr/ -> http://pp-ocrv6:11500` by CONTAINER NAME. That name only resolves on
# the network nginx-lb shares with us — `sidecar-net`, which lives outside this
# compose project. Declaring it here (rather than attaching by hand after the
# fact) is what makes the wiring survive a rebuild.
#
# Learned from the fun-asr outage on: that sidecar's compose had the
# same gap, a `up -d --build` brought it back on its own project network only,
# nginx-lb could no longer resolve the name, and every /asr/* request 502'd —
# while the service answered fine on the host's published port, so a
# direct-to-host probe still looked green. `/ocr/` is the only other route that
# resolves by container name; the rest of nginx-lb's upstreams go via the host
# bridge and don't depend on this network at all.
networks:
  sidecar-net:
    external: true           # pre-existing + shared; this project attaches, never owns
